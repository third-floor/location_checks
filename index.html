<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Leaflet Map + Nominatim Search + CSV Places</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Leaflet Control Geocoder CSS (Nominatim) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

<style>
  body { font-family: Arial, sans-serif; margin: 0; }
  #map { height: 65vh; width: 100%; }
  #distanceOutput { padding: 10px; font-size: 1.1em; }
  #table-container { padding: 15px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ccc; padding: 6px; }
  tr:hover { background-color: #eef; cursor: pointer; }
  #tableSearch { width: 100%; padding: 6px; margin-bottom: 10px; }
</style>
</head>

<body>

<h2 style="padding:10px">Leaflet Map + Nominatim Search + Places Table</h2>

<div id="map"></div>

<div id="distanceOutput"></div>

<div id="table-container">
  <h3>Places</h3>
  <input id="tableSearch" placeholder="Search table…" />
  <table id="placesTable">
    <thead>
      <tr>
        <th>Preferred Term</th>
        <th>Latitude</th>
        <th>Longitude</th>
        <th>Reconcile</th>
        <th>PLACE.MPLAC_ID</th>
        <th>TGN_ID</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- JS Libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- PapaParse (CSV parser) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Leaflet Control Geocoder (Nominatim search) -->
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>

// =======================================================
// 1. Initialize Leaflet Map
// =======================================================
const map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let tableData = [];
let selectedPlace = null;
let tableMarker = null;
let searchMarker = null;


// =======================================================
// 2. FREE Nominatim Geocoder Search Box (no API key)
// =======================================================
const geocoder = L.Control.geocoder({
    defaultMarkGeocode: false
})
.on('markgeocode', function(e) {
    const latlng = e.geocode.center;

    if (searchMarker) map.removeLayer(searchMarker);

    searchMarker = L.marker(latlng).addTo(map)
        .bindPopup(e.geocode.name)
        .openPopup();

    map.setView(latlng, 10);

    if (selectedPlace) {
        const km = haversine(selectedPlace.lat, selectedPlace.lng, latlng.lat, latlng.lng);

        document.getElementById("distanceOutput").innerHTML =
            `Distance from <b>${selectedPlace.name}</b> to <b>${e.geocode.name}</b>: 
             <b>${km.toFixed(2)} km</b>`;
    }
})
.addTo(map);


// =======================================================
// 3. Load CSV (places.csv must be in GitHub repo root)
// =======================================================
Papa.parse("places.csv", {
    download: true,
    header: true,
    dynamicTyping: true,
    complete: (results) => {
        tableData = results.data.filter(r =>
            r["Preferred Term"] &&
            r.Latitude &&
            r.Longitude
        );
        populateTable(tableData);
    }
});


// =======================================================
// 4. Populate Table
// =======================================================
function populateTable(data) {
    const tbody = document.querySelector("#placesTable tbody");
    tbody.innerHTML = "";

    data.forEach(row => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${row["Preferred Term"]}</td>
          <td>${row.Latitude}</td>
          <td>${row.Longitude}</td>
          <td>${row.Reconcile ?? ""}</td>
          <td>${row["PLACE.MPLAC_ID"] ?? ""}</td>
          <td>${row["TGN_ID"] ?? ""}</td>
        `;

        // If row is clicked
        tr.addEventListener("click", () => {
            const lat = parseFloat(row.Latitude);
            const lng = parseFloat(row.Longitude);

            selectedPlace = {
                name: row["Preferred Term"],
                lat, lng
            };

            if (tableMarker) map.removeLayer(tableMarker);

            tableMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup(row["Preferred Term"])
                .openPopup();

            map.setView([lat, lng], 8);

            document.getElementById("distanceOutput").innerHTML =
                `Selected: <b>${row["Preferred Term"]}</b>`;
        });

        tbody.appendChild(tr);
    });
}


// =======================================================
// 5. Table Search Filter
// =======================================================
document.getElementById("tableSearch").addEventListener("input", function () {
    const term = this.value.toLowerCase();
    const filtered = tableData.filter(r =>
        r["Preferred Term"] &&
        r["Preferred Term"].toLowerCase().includes(term)
    );
    populateTable(filtered);
});


// =======================================================
// 6. Haversine Distance Calculation (km)
// =======================================================
function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const toRad = x => x * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon/2)**2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

</script>

</body>
</html>
